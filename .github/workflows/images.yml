name: Container image

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect documentation-only changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      images: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || steps.filter.outputs.images == 'true' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Detect changes requiring image checks
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.ref }}
          predicate-quantifier: every
          # Only prose outside the application is exempt; unknown paths run CI.
          filters: |
            images:
              - '!*.md'
              - '!docs/**/*.md'

  docs:
    name: Documentation checks
    needs: changes
    if: needs.changes.outputs.images != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check tracked Markdown links and anchors
        run: bin/check docs

  quick:
    name: Quick checks
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build development tools without production assets
        uses: docker/build-push-action@v7
        with:
          context: .
          target: development
          load: true
          tags: decidim-coolify:tools-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=development
          cache-to: type=gha,mode=max,scope=development

      - name: Run quick checks
        run: bin/check quick
        env:
          CHECK_TOOL_IMAGE: decidim-coolify:tools-${{ github.run_id }}-${{ github.run_attempt }}

  test:
    needs: [changes, quick]
    if: needs.changes.outputs.images == 'true'
    name: Build and smoke-test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # First deployment target: x86-64 AMD on Hetzner CPX41.
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          # Native ARM64 CI is portability coverage; production starts on x86-64.
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: app
          platforms: ${{ matrix.platform }}
          tags: decidim-coolify:test-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          load: true
          cache-from: type=gha,scope=smoke-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=smoke-${{ matrix.arch }}

      - name: Verify the built image and disposable stack
        run: bin/check image --image "$TEST_IMAGE" --platform "$TEST_PLATFORM"
        env:
          TEST_IMAGE: decidim-coolify:test-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          TEST_PLATFORM: ${{ matrix.platform }}

  ci:
    name: CI
    if: always()
    needs: [changes, docs, quick, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Check required results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          IMAGES_REQUIRED: ${{ needs.changes.outputs.images }}
          DOCS_RESULT: ${{ needs.docs.result }}
          QUICK_RESULT: ${{ needs.quick.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$IMAGES_REQUIRED" = true ]; then
            test "$DOCS_RESULT" = skipped
            test "$QUICK_RESULT" = success
            test "$TEST_RESULT" = success
          else
            test "$DOCS_RESULT" = success
            test "$QUICK_RESULT" = skipped
            test "$TEST_RESULT" = skipped
          fi

  publish:
    name: Publish versioned multi-architecture image
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Derive GHCR image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Select immutable source and optional version tags
        id: tags
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          {
            echo 'values<<TAGS'
            echo "$IMAGE_NAME:sha-$GITHUB_SHA"
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "$IMAGE_NAME:$GITHUB_REF_NAME"
            fi
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-architecture image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.values }}
          # Reuse the native builds that passed the test jobs, as well as any
          # previous publication cache. Cache misses still rebuild normally.
          cache-from: |
            type=gha,scope=publish
            type=gha,scope=smoke-amd64
            type=gha,scope=smoke-arm64
          cache-to: type=gha,mode=max,scope=publish
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          sbom: true
          provenance: mode=max


      - name: Prepare pinned deployment configuration
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            image_ref="$IMAGE_NAME:$GITHUB_REF_NAME@$IMAGE_DIGEST"
          else
            image_ref="$IMAGE_NAME:sha-$GITHUB_SHA@$IMAGE_DIGEST"
          fi
          python3 pin_release.py "$image_ref"
          python3 validate.py

      - name: Upload deployment configuration
        uses: actions/upload-artifact@v4
        with:
          name: deployment-compose
          path: compose.yaml
          if-no-files-found: error

      - name: Report image for the deployment commit
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf '## Published application image\n\n`%s@%s`\n\n' "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Dependabot checks version-tagged releases on its configured schedule and proposes the version and digest update. Review and merge its PR. The deployment-compose artefact is also available for recovery or a standalone installation.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Publication does not deploy. Use the manual maintenance procedure in docs/OPERATIONS.md.' >> "$GITHUB_STEP_SUMMARY"
